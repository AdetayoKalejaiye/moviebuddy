<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MovieBuddy</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;margin:2rem}
      textarea{width:100%;height:100px}
      .box{border:1px solid #ddd;padding:1rem;border-radius:6px;margin-top:1rem}
      .user{color:#2b6cb0}
      .assistant{color:#2f855a}
      button{padding:0.5rem 1rem;font-size:1rem}
    </style>
  </head>
  <body>
    <h1>MovieBuddy</h1>
    <p>Ask me about movies — I'll respond enthusiastically and suggest picks!</p>

    <form method="post">
      <label for="message">Your message</label>
      <textarea id="message" name="message" placeholder="Ask for recommendations, reviews, or movie ideas">{{ user_msg }}</textarea>
      <div style="margin-top:.5rem"><button type="submit">Send</button></div>
    </form>

    {% if assistant_msg %}
    <div class="box">
      <div class="assistant"><strong>MovieBuddy:</strong></div>
      <div style="margin-top:.5rem;white-space:pre-wrap">{{ assistant_msg }}</div>
    </div>
    {% endif %}
  </body>
</html>
